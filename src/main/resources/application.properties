spring.application.name=springboot-facturacion-ult
# ===============================
# Datasource (central auth DB INTEGRACION)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/INTEGRACION
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ESTO ESSOLO PARA AVANZAR EN LA ETAPA DEL LOGIN Y CONEXION A LA BD
spring.main.allow-circular-references=true

# Evita que Hibernate convierta nombres a snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# Configuración de logs
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Jackson (dates)
# ===============================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Security / JWT
# ===============================
security.jwt.secret=MiSuperClaveSecretaDeAlMenos32Caracteres123!
security.jwt.expiration-minutes=120
